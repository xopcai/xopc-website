<svg xmlns="http://www.w3.org/2000/svg" width="840" height="735" viewBox="0 0 840 735" role="img" aria-labelledby="title"><title id="title">批准状态不等于外部执行结果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="735" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">03 / APPROVAL &amp; EXECUTION</text><text x="32" y="85" font-size="30" fill="#e5ebf3" font-weight="600">已批准，还没有执行完</text><rect x="32" y="128" width="776" height="86" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="162" font-size="21" fill="#e5ebf3" font-weight="600">pending · 等待确认</text><text x="52" y="193" font-size="17" fill="#aab8c9" font-weight="400">用户决定；拒绝则停止</text><path d="M420 214V239" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="250" width="776" height="86" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="284" font-size="21" fill="#e5ebf3" font-weight="600">approved · 已批准</text><text x="52" y="315" font-size="17" fill="#aab8c9" font-weight="400">匹配动作与参数，并检查有效期</text><path d="M420 336V361" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="372" width="776" height="86" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="406" font-size="21" fill="#8bb9ff" font-weight="600">consumed · 已使用</text><text x="52" y="437" font-size="17" fill="#aab8c9" font-weight="400">在本地事务中消耗这一次批准</text><path d="M420 458V483" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="494" width="776" height="86" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="528" font-size="21" fill="#e5ebf3" font-weight="600">外部执行</text><text x="52" y="559" font-size="17" fill="#aab8c9" font-weight="400">继续策略检查并尝试调用服务</text><rect x="32" y="616" width="776" height="87" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="650" font-size="22" fill="#efb78e" font-weight="600">返回成功 / 报错 / 结果尚不确定</text><text x="52" y="680" font-size="18" fill="#aab8c9" font-weight="400">批准不会因为外部失败而自动变回可用。</text></g></svg>