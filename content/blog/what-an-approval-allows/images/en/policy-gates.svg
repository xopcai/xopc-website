<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-labelledby="title"><title id="title">Check policy before confirmation</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="760" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">03 / EXECUTION POLICY</text><text x="32" y="82" font-size="30" fill="#17212f" font-weight="600">Check policy before confirmation</text><rect x="32" y="140" width="776" height="106" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="172" font-size="21" fill="#17212f" font-weight="600">Is the connector enabled?</text><text x="52" y="204" font-size="17" fill="#526071" font-weight="400">Disabled → deny.</text><path d="M420 246V277" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="282" width="776" height="106" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="314" font-size="21" fill="#17212f" font-weight="600">Are the agent and account allowed?</text><text x="52" y="346" font-size="17" fill="#526071" font-weight="400">Outside the allowed set → deny.</text><path d="M420 388V419" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="424" width="776" height="106" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="456" font-size="21" fill="#17212f" font-weight="600">Is the action within the scope ceiling?</text><text x="52" y="488" font-size="17" fill="#526071" font-weight="400">Excessive scope or unmet action requirements → deny.</text><path d="M420 530V561" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="566" width="776" height="106" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="598" font-size="21" fill="#245dc5" font-weight="600">Does this invocation require confirmation?</text><text x="52" y="630" font-size="17" fill="#526071" font-weight="400">Required but not confirmed → wait for approval.</text><text x="32" y="714" font-size="16" fill="#526071" font-weight="400">Confirmation satisfies the final condition; it cannot override earlier denials.</text></g></svg>