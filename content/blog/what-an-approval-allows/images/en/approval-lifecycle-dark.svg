<svg xmlns="http://www.w3.org/2000/svg" width="840" height="902" viewBox="0 0 840 902" role="img" aria-labelledby="title"><title id="title">Approved is not yet completed</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="902" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">03 / APPROVAL &amp; EXECUTION</text><text x="32" y="82" font-size="30" fill="#e5ebf3" font-weight="600">Approved is not yet completed</text><rect x="32" y="140" width="776" height="106" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="172" font-size="21" fill="#e5ebf3" font-weight="600">pending / Waiting for a decision</text><text x="52" y="204" font-size="17" fill="#aab8c9" font-weight="400">The user can approve or deny.</text><path d="M420 246V277" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="282" width="776" height="106" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="314" font-size="21" fill="#e5ebf3" font-weight="600">approved / Permission granted</text><text x="52" y="346" font-size="17" fill="#aab8c9" font-weight="400">Match the request and check expiry.</text><path d="M420 388V419" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="424" width="776" height="106" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="456" font-size="21" fill="#8bb9ff" font-weight="600">consumed / Approval used</text><text x="52" y="488" font-size="17" fill="#aab8c9" font-weight="400">Consume approval in a local write transaction.</text><path d="M420 530V561" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="566" width="776" height="106" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="598" font-size="21" fill="#e5ebf3" font-weight="600">External execution</text><text x="52" y="630" font-size="17" fill="#aab8c9" font-weight="400">Continue policy checks and attempt the service call.</text><path d="M420 672V703" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="708" width="776" height="106" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="740" font-size="21" fill="#e5ebf3" font-weight="600">Success, error, or an uncertain outcome</text><text x="52" y="772" font-size="17" fill="#aab8c9" font-weight="400">External failure does not automatically restore approval.</text><text x="32" y="856" font-size="16" fill="#aab8c9" font-weight="400">After a timeout, the external facts still need to be checked.</text></g></svg>