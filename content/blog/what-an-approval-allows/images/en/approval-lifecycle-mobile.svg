<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1076" viewBox="0 0 440 1076" role="img" aria-labelledby="title"><title id="title">Approved is not yet completed</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="440" height="1076" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">03 / APPROVAL &amp; EXECUTION</text><text x="32" y="82" font-size="26" fill="#17212f" font-weight="600">Approved is not yet</text><text x="32" y="116" font-size="26" fill="#17212f" font-weight="600">completed</text><rect x="32" y="165" width="376" height="133" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="197" font-size="21" fill="#17212f" font-weight="600">pending / Waiting for a</text><text x="52" y="224" font-size="21" fill="#17212f" font-weight="600">decision</text><text x="52" y="256" font-size="17" fill="#526071" font-weight="400">The user can approve or deny.</text><path d="M220 298V329" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="334" width="376" height="106" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="366" font-size="21" fill="#17212f" font-weight="600">approved / Permission granted</text><text x="52" y="398" font-size="17" fill="#526071" font-weight="400">Match the request and check expiry.</text><path d="M220 440V471" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="476" width="376" height="130" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="508" font-size="21" fill="#245dc5" font-weight="600">consumed / Approval used</text><text x="52" y="540" font-size="17" fill="#526071" font-weight="400">Consume approval in a local write</text><text x="52" y="564" font-size="17" fill="#526071" font-weight="400">transaction.</text><path d="M220 606V637" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="642" width="376" height="130" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="674" font-size="21" fill="#17212f" font-weight="600">External execution</text><text x="52" y="706" font-size="17" fill="#526071" font-weight="400">Continue policy checks and attempt</text><text x="52" y="730" font-size="17" fill="#526071" font-weight="400">the service call.</text><path d="M220 772V803" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="808" width="376" height="157" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="840" font-size="21" fill="#17212f" font-weight="600">Success, error, or an</text><text x="52" y="867" font-size="21" fill="#17212f" font-weight="600">uncertain outcome</text><text x="52" y="899" font-size="17" fill="#526071" font-weight="400">External failure does not</text><text x="52" y="923" font-size="17" fill="#526071" font-weight="400">automatically restore approval.</text><text x="32" y="1007" font-size="16" fill="#526071" font-weight="400">After a timeout, the external facts</text><text x="32" y="1030" font-size="16" fill="#526071" font-weight="400">still need to be checked.</text></g></svg>