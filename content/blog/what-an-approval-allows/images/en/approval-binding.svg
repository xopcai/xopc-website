<svg xmlns="http://www.w3.org/2000/svg" width="840" height="542" viewBox="0 0 840 542" role="img" aria-labelledby="title"><title id="title">Approval covers this request</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="542" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">03 / APPROVAL BINDING</text><text x="32" y="82" font-size="30" fill="#17212f" font-weight="600">Approval covers this request</text><rect x="32" y="135" width="776" height="120" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="167" font-size="21" fill="#245dc5" font-weight="600">Check identity and action first</text><text x="52" y="199" font-size="17" fill="#526071" font-weight="400">Then hash arguments + account + available objective scope.</text><path d="M420 255V287" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M220 287H620" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M220 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="315" width="376" height="154" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="347" font-size="21" fill="#245dc5" font-weight="600">Only key order changes</text><text x="52" y="379" font-size="17" fill="#526071" font-weight="400">Sort object keys recursively.</text><text x="52" y="403" font-size="17" fill="#526071" font-weight="400">The fingerprint stays the same.</text><text x="52" y="427" font-size="17" fill="#526071" font-weight="400">Still check state and expiry.</text><path d="M620 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="315" width="376" height="154" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="452" y="347" font-size="21" fill="#17212f" font-weight="600">Recipient or body changes</text><text x="452" y="379" font-size="17" fill="#526071" font-weight="400">Actual values differ.</text><text x="452" y="403" font-size="17" fill="#526071" font-weight="400">The fingerprint changes.</text><text x="452" y="427" font-size="17" fill="#526071" font-weight="400">The old approval cannot be reused.</text><text x="32" y="499" font-size="16" fill="#526071" font-weight="400">The fingerprint checks consistency. It does not judge semantic similarity.</text></g></svg>