<svg xmlns="http://www.w3.org/2000/svg" width="440" height="798" viewBox="0 0 440 798" role="img" aria-labelledby="title"><title id="title">Approval covers this request</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="798" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">03 / APPROVAL BINDING</text><text x="32" y="82" font-size="26" fill="#e5ebf3" font-weight="600">Approval covers this</text><text x="32" y="116" font-size="26" fill="#e5ebf3" font-weight="600">request</text><rect x="32" y="162" width="376" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="194" font-size="21" fill="#8bb9ff" font-weight="600">Check identity and action</text><text x="52" y="221" font-size="21" fill="#8bb9ff" font-weight="600">first</text><text x="52" y="253" font-size="17" fill="#aab8c9" font-weight="400">Then hash arguments + account +</text><text x="52" y="277" font-size="17" fill="#aab8c9" font-weight="400">available objective scope.</text><path d="M220 282V306H20V564" fill="none" stroke="#627184" stroke-width="2"/><path d="M20 382H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="342" width="344" height="159" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="84" y="374" font-size="21" fill="#8bb9ff" font-weight="600">Only key order changes</text><text x="84" y="406" font-size="17" fill="#aab8c9" font-weight="400">Sort object keys recursively.</text><text x="84" y="430" font-size="17" fill="#aab8c9" font-weight="400">The fingerprint stays the same.</text><text x="84" y="454" font-size="17" fill="#aab8c9" font-weight="400">Still check state and expiry.</text><path d="M20 564H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="524" width="344" height="183" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="556" font-size="21" fill="#e5ebf3" font-weight="600">Recipient or body changes</text><text x="84" y="588" font-size="17" fill="#aab8c9" font-weight="400">Actual values differ.</text><text x="84" y="612" font-size="17" fill="#aab8c9" font-weight="400">The fingerprint changes.</text><text x="84" y="636" font-size="17" fill="#aab8c9" font-weight="400">The old approval cannot be</text><text x="84" y="660" font-size="17" fill="#aab8c9" font-weight="400">reused.</text><text x="32" y="732" font-size="16" fill="#aab8c9" font-weight="400">The fingerprint checks consistency. It</text><text x="32" y="755" font-size="16" fill="#aab8c9" font-weight="400">does not judge semantic similarity.</text></g></svg>