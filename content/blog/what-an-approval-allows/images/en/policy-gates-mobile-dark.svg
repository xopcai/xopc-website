<svg xmlns="http://www.w3.org/2000/svg" width="440" height="960" viewBox="0 0 440 960" role="img" aria-labelledby="title"><title id="title">Check policy before confirmation</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="960" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">03 / EXECUTION POLICY</text><text x="32" y="82" font-size="26" fill="#e5ebf3" font-weight="600">Check policy before</text><text x="32" y="116" font-size="26" fill="#e5ebf3" font-weight="600">confirmation</text><rect x="32" y="165" width="376" height="106" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="197" font-size="21" fill="#e5ebf3" font-weight="600">Is the connector enabled?</text><text x="52" y="229" font-size="17" fill="#aab8c9" font-weight="400">Disabled → deny.</text><path d="M220 271V302" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="307" width="376" height="133" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="339" font-size="21" fill="#e5ebf3" font-weight="600">Are the agent and account</text><text x="52" y="366" font-size="21" fill="#e5ebf3" font-weight="600">allowed?</text><text x="52" y="398" font-size="17" fill="#aab8c9" font-weight="400">Outside the allowed set → deny.</text><path d="M220 440V471" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="476" width="376" height="157" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="508" font-size="21" fill="#e5ebf3" font-weight="600">Is the action within the</text><text x="52" y="535" font-size="21" fill="#e5ebf3" font-weight="600">scope ceiling?</text><text x="52" y="567" font-size="17" fill="#aab8c9" font-weight="400">Excessive scope or unmet action</text><text x="52" y="591" font-size="17" fill="#aab8c9" font-weight="400">requirements → deny.</text><path d="M220 633V664" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="669" width="376" height="157" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="701" font-size="21" fill="#8bb9ff" font-weight="600">Does this invocation require</text><text x="52" y="728" font-size="21" fill="#8bb9ff" font-weight="600">confirmation?</text><text x="52" y="760" font-size="17" fill="#aab8c9" font-weight="400">Required but not confirmed → wait</text><text x="52" y="784" font-size="17" fill="#aab8c9" font-weight="400">for approval.</text><text x="32" y="868" font-size="16" fill="#aab8c9" font-weight="400">Confirmation satisfies the final</text><text x="32" y="891" font-size="16" fill="#aab8c9" font-weight="400">condition; it cannot override earlier</text><text x="32" y="914" font-size="16" fill="#aab8c9" font-weight="400">denials.</text></g></svg>