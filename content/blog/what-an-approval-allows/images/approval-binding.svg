<svg xmlns="http://www.w3.org/2000/svg" width="840" height="670" viewBox="0 0 840 670" role="img" aria-labelledby="title"><title id="title">批准绑定身份和完整动作参数</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="670" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500">03 / APPROVAL BINDING</text><text x="32" y="85" font-size="30" fill="#17212f" font-weight="600">批准的是这一次动作</text><rect x="32" y="128" width="776" height="128" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="162" font-size="21" fill="#17212f" font-weight="600">先核对身份与动作</text><text x="52" y="193" font-size="17" fill="#526071" font-weight="400">用户 · Agent · 会话 · 连接器 · 动作</text><text x="52" y="218" font-size="17" fill="#526071" font-weight="400">批准关联的连接必须对应当前账户</text><path d="M420 256V290" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="294" width="776" height="128" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="328" font-size="21" fill="#245dc5" font-weight="600">再计算参数指纹</text><text x="52" y="359" font-size="17" fill="#526071" font-weight="400">完整动作参数 + 账户 + 可用的任务范围</text><text x="52" y="384" font-size="17" fill="#526071" font-weight="400">递归排序对象键 → JSON → SHA-256</text><path d="M420 422V455H222V481" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 455H622V481" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="486" width="376" height="100" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="520" font-size="21" fill="#245dc5" font-weight="600">仅对象键顺序变化</text><text x="52" y="551" font-size="17" fill="#526071" font-weight="400">指纹相同，继续检查状态</text><rect x="432" y="486" width="376" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="452" y="520" font-size="21" fill="#17212f" font-weight="600">收件人或正文改变</text><text x="452" y="551" font-size="17" fill="#526071" font-weight="400">指纹不同，原批准不能沿用</text><text x="32" y="638" font-size="19" fill="#526071" font-weight="400">指纹比较一致性，不判断两段话是否“差不多”。</text></g></svg>