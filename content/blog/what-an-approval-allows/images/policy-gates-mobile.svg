<svg xmlns="http://www.w3.org/2000/svg" width="440" height="930" viewBox="0 0 440 930" role="img" aria-labelledby="title"><title id="title">用户确认不能覆盖本地策略拒绝</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="440" height="930" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500">03 / EXECUTION POLICY</text><text x="32" y="85" font-size="25" fill="#17212f" font-weight="600">先检查权限，再请求确认</text><rect x="32" y="128" width="376" height="124" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="162" font-size="21" fill="#17212f" font-weight="600">连接器是否启用</text><text x="52" y="193" font-size="17" fill="#526071" font-weight="400">禁用 → 拒绝</text><path d="M220 252V297" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="308" width="376" height="124" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="342" font-size="21" fill="#17212f" font-weight="600">Agent 与账户是否允许</text><text x="52" y="373" font-size="17" fill="#526071" font-weight="400">超出允许范围 → 拒绝</text><path d="M220 432V477" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="488" width="376" height="124" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="522" font-size="21" fill="#17212f" font-weight="600">动作是否在权限上限内</text><text x="52" y="553" font-size="17" fill="#526071" font-weight="400">越权或不符合动作要求 → 拒绝</text><path d="M220 612V657" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="668" width="376" height="124" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="702" font-size="21" fill="#245dc5" font-weight="600">策略是否要求本次确认</text><text x="52" y="733" font-size="17" fill="#526071" font-weight="400">需要且未确认 → 等待批准</text><text x="32" y="883" font-size="18" fill="#526071" font-weight="400">通过确认，只满足最后一道条件。</text></g></svg>