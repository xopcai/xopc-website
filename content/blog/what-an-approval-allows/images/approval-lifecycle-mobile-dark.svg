<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1040" viewBox="0 0 440 1040" role="img" aria-labelledby="title"><title id="title">批准状态不等于外部执行结果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="1040" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">03 / APPROVAL &amp; EXECUTION</text><text x="32" y="85" font-size="25" fill="#e5ebf3" font-weight="600">已批准，还没有执行完</text><rect x="32" y="128" width="376" height="112" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="162" font-size="21" fill="#e5ebf3" font-weight="600">pending · 等待确认</text><text x="52" y="193" font-size="17" fill="#aab8c9" font-weight="400">用户决定；拒绝则停止</text><path d="M220 240V283" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="294" width="376" height="112" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="328" font-size="21" fill="#e5ebf3" font-weight="600">approved · 已批准</text><text x="52" y="359" font-size="17" fill="#aab8c9" font-weight="400">匹配动作与参数，并检查有效期</text><path d="M220 406V449" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="460" width="376" height="112" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="494" font-size="21" fill="#8bb9ff" font-weight="600">consumed · 已使用</text><text x="52" y="525" font-size="17" fill="#aab8c9" font-weight="400">在本地事务中消耗这一次批准</text><path d="M220 572V615" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="626" width="376" height="112" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="660" font-size="21" fill="#e5ebf3" font-weight="600">外部执行</text><text x="52" y="691" font-size="17" fill="#aab8c9" font-weight="400">继续策略检查并尝试调用服务</text><rect x="32" y="830" width="376" height="152" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="869" font-size="19" fill="#efb78e" font-weight="600">返回成功 / 报错 / 结果尚不确定</text><text x="52" y="902" font-size="16" fill="#aab8c9" font-weight="400">批准不会因为外部失败而自动变回可用。</text><text x="52" y="934" font-size="17" fill="#aab8c9" font-weight="400">超时之后，仍需核实外部事实。</text></g></svg>