<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" role="img" aria-labelledby="title"><title id="title">用户确认不能覆盖本地策略拒绝</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="690" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">03 / EXECUTION POLICY</text><text x="32" y="85" font-size="30" fill="#e5ebf3" font-weight="600">先检查权限，再请求确认</text><rect x="32" y="128" width="776" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="162" font-size="21" fill="#e5ebf3" font-weight="600">连接器是否启用</text><text x="52" y="193" font-size="17" fill="#aab8c9" font-weight="400">禁用 → 拒绝</text><path d="M420 219V244" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="255" width="776" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="289" font-size="21" fill="#e5ebf3" font-weight="600">Agent 与账户是否允许</text><text x="52" y="320" font-size="17" fill="#aab8c9" font-weight="400">超出允许范围 → 拒绝</text><path d="M420 346V371" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="382" width="776" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="416" font-size="21" fill="#e5ebf3" font-weight="600">动作是否在权限上限内</text><text x="52" y="447" font-size="17" fill="#aab8c9" font-weight="400">越权或不符合动作要求 → 拒绝</text><path d="M420 473V498" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="509" width="776" height="91" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="543" font-size="21" fill="#8bb9ff" font-weight="600">策略是否要求本次确认</text><text x="52" y="574" font-size="17" fill="#aab8c9" font-weight="400">需要且未确认 → 等待批准</text><text x="32" y="664" font-size="20" fill="#aab8c9" font-weight="400">通过确认，只满足最后一道条件。</text></g></svg>