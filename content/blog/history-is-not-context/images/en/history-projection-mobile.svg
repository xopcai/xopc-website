<svg xmlns="http://www.w3.org/2000/svg" width="440" height="750" viewBox="0 0 440 750" role="img" aria-labelledby="title"><title id="title">One history, different readers</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="440" height="750" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">02 / HISTORY PROJECTION</text><text x="32" y="82" font-size="26" fill="#17212f" font-weight="600">One history, different</text><text x="32" y="116" font-size="26" fill="#17212f" font-weight="600">readers</text><rect x="32" y="162" width="376" height="120" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="194" font-size="21" fill="#245dc5" font-weight="600">Stored transcript records</text><text x="52" y="226" font-size="17" fill="#526071" font-weight="400">Messages, tool results, metadata,</text><text x="52" y="250" font-size="17" fill="#526071" font-weight="400">and checkpoints</text><path d="M220 282V306H20V540" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M20 382H62" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="342" width="344" height="135" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="84" y="374" font-size="21" fill="#17212f" font-weight="600">For display</text><text x="84" y="406" font-size="17" fill="#526071" font-weight="400">Read according to display rules.</text><text x="84" y="430" font-size="17" fill="#526071" font-weight="400">Show the conversation to people.</text><path d="M20 540H62" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="500" width="344" height="159" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="84" y="532" font-size="21" fill="#245dc5" font-weight="600">For the model</text><text x="84" y="564" font-size="17" fill="#526071" font-weight="400">Read messages and checkpoints.</text><text x="84" y="588" font-size="17" fill="#526071" font-weight="400">Then pair tools and filter</text><text x="84" y="612" font-size="17" fill="#526071" font-weight="400">browser images.</text><text x="32" y="684" font-size="16" fill="#526071" font-weight="400">These are views of the same records, not</text><text x="32" y="707" font-size="16" fill="#526071" font-weight="400">two independently edited histories.</text></g></svg>