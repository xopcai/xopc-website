<svg xmlns="http://www.w3.org/2000/svg" width="840" height="569" viewBox="0 0 840 569" role="img" aria-labelledby="title"><title id="title">What enters the next turn</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="569" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">02 / TOOL CALL PAIRING</text><text x="32" y="82" font-size="30" fill="#17212f" font-weight="600">What enters the next turn</text><rect x="32" y="135" width="776" height="120" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="167" font-size="21" fill="#245dc5" font-weight="600">Scan calls and results</text><text x="52" y="199" font-size="17" fill="#526071" font-weight="400">Match by ID; the result must follow its call.</text><path d="M420 255V287" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M153.33333333333331 287H686.6666666666666" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M153.33333333333331 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="315" width="242.66666666666666" height="181" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="347" font-size="21" fill="#245dc5" font-weight="600">Call + later</text><text x="52" y="374" font-size="21" fill="#245dc5" font-weight="600">result</text><text x="52" y="406" font-size="17" fill="#526071" font-weight="400">test-1 matches test-1</text><text x="52" y="430" font-size="17" fill="#526071" font-weight="400">Keep the completed</text><text x="52" y="454" font-size="17" fill="#526071" font-weight="400">pair.</text><path d="M419.99999999999994 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="298.66666666666663" y="315" width="242.66666666666666" height="181" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="318.66666666666663" y="347" font-size="21" fill="#17212f" font-weight="600">Call without a</text><text x="318.66666666666663" y="374" font-size="21" fill="#17212f" font-weight="600">result</text><text x="318.66666666666663" y="406" font-size="17" fill="#526071" font-weight="400">patch-1 has no result</text><text x="318.66666666666663" y="430" font-size="17" fill="#526071" font-weight="400">Remove the orphan</text><text x="318.66666666666663" y="454" font-size="17" fill="#526071" font-weight="400">call.</text><path d="M686.6666666666666 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="565.3333333333333" y="315" width="242.66666666666666" height="181" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="585.3333333333333" y="347" font-size="21" fill="#17212f" font-weight="600">Result without a</text><text x="585.3333333333333" y="374" font-size="21" fill="#17212f" font-weight="600">call</text><text x="585.3333333333333" y="406" font-size="17" fill="#526071" font-weight="400">No call for stale-1</text><text x="585.3333333333333" y="430" font-size="17" fill="#526071" font-weight="400">Remove the orphan</text><text x="585.3333333333333" y="454" font-size="17" fill="#526071" font-weight="400">result.</text><text x="32" y="526" font-size="16" fill="#526071" font-weight="400">Removing a record from model input does not undo the action.</text></g></svg>