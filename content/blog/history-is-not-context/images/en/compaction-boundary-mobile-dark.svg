<svg xmlns="http://www.w3.org/2000/svg" width="440" height="905" viewBox="0 0 440 905" role="img" aria-labelledby="title"><title id="title">Resume from the latest checkpoint</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="905" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">02 / COMPACTION BOUNDARY</text><text x="32" y="82" font-size="26" fill="#e5ebf3" font-weight="600">Resume from the latest</text><text x="32" y="116" font-size="26" fill="#e5ebf3" font-weight="600">checkpoint</text><rect x="32" y="165" width="376" height="178" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="197" font-size="21" fill="#e5ebf3" font-weight="600">01 / Read checkpoint A</text><text x="52" y="229" font-size="17" fill="#aab8c9" font-weight="400">Replace current output with</text><text x="52" y="253" font-size="17" fill="#aab8c9" font-weight="400">A.messages.</text><text x="52" y="277" font-size="17" fill="#aab8c9" font-weight="400">The snapshot carries the history it</text><text x="52" y="301" font-size="17" fill="#aab8c9" font-weight="400">retains.</text><path d="M220 343V374" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="379" width="376" height="178" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="411" font-size="21" fill="#e5ebf3" font-weight="600">02 / Later, read checkpoint B</text><text x="52" y="443" font-size="17" fill="#aab8c9" font-weight="400">Replace current output with</text><text x="52" y="467" font-size="17" fill="#aab8c9" font-weight="400">B.messages.</text><text x="52" y="491" font-size="17" fill="#aab8c9" font-weight="400">Do not re-append A or older raw</text><text x="52" y="515" font-size="17" fill="#aab8c9" font-weight="400">messages.</text><path d="M220 557V588" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="593" width="376" height="178" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="625" font-size="21" fill="#8bb9ff" font-weight="600">03 / Read newer messages</text><text x="52" y="657" font-size="17" fill="#aab8c9" font-weight="400">Final context: B.messages + newer</text><text x="52" y="681" font-size="17" fill="#aab8c9" font-weight="400">messages.</text><text x="52" y="705" font-size="17" fill="#aab8c9" font-weight="400">Then check tool pairs and browser</text><text x="52" y="729" font-size="17" fill="#aab8c9" font-weight="400">images.</text><text x="32" y="813" font-size="16" fill="#aab8c9" font-weight="400">A valid structure does not prove the</text><text x="32" y="836" font-size="16" fill="#aab8c9" font-weight="400">summary preserved every important</text><text x="32" y="859" font-size="16" fill="#aab8c9" font-weight="400">detail.</text></g></svg>