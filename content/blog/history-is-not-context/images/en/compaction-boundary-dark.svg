<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" role="img" aria-labelledby="title"><title id="title">Resume from the latest checkpoint</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="690" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">02 / COMPACTION BOUNDARY</text><text x="32" y="82" font-size="30" fill="#e5ebf3" font-weight="600">Resume from the latest checkpoint</text><rect x="32" y="140" width="776" height="130" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="172" font-size="21" fill="#e5ebf3" font-weight="600">01 / Read checkpoint A</text><text x="52" y="204" font-size="17" fill="#aab8c9" font-weight="400">Replace current output with A.messages.</text><text x="52" y="228" font-size="17" fill="#aab8c9" font-weight="400">The snapshot carries the history it retains.</text><path d="M420 270V301" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="306" width="776" height="130" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="338" font-size="21" fill="#e5ebf3" font-weight="600">02 / Later, read checkpoint B</text><text x="52" y="370" font-size="17" fill="#aab8c9" font-weight="400">Replace current output with B.messages.</text><text x="52" y="394" font-size="17" fill="#aab8c9" font-weight="400">Do not re-append A or older raw messages.</text><path d="M420 436V467" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="472" width="776" height="130" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="504" font-size="21" fill="#8bb9ff" font-weight="600">03 / Read newer messages</text><text x="52" y="536" font-size="17" fill="#aab8c9" font-weight="400">Final context: B.messages + newer messages.</text><text x="52" y="560" font-size="17" fill="#aab8c9" font-weight="400">Then check tool pairs and browser images.</text><text x="32" y="644" font-size="16" fill="#aab8c9" font-weight="400">A valid structure does not prove the summary preserved every important detail.</text></g></svg>