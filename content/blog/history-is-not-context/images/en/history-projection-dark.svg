<svg xmlns="http://www.w3.org/2000/svg" width="840" height="542" viewBox="0 0 840 542" role="img" aria-labelledby="title"><title id="title">One history, different readers</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="542" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">02 / HISTORY PROJECTION</text><text x="32" y="82" font-size="30" fill="#e5ebf3" font-weight="600">One history, different readers</text><rect x="32" y="135" width="776" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="167" font-size="21" fill="#8bb9ff" font-weight="600">Stored transcript records</text><text x="52" y="199" font-size="17" fill="#aab8c9" font-weight="400">Messages, tool results, metadata, and checkpoints</text><path d="M420 255V287" fill="none" stroke="#627184" stroke-width="2"/><path d="M220 287H620" fill="none" stroke="#627184" stroke-width="2"/><path d="M220 287V311" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="315" width="376" height="154" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="347" font-size="21" fill="#e5ebf3" font-weight="600">For display</text><text x="52" y="379" font-size="17" fill="#aab8c9" font-weight="400">Read according to display rules.</text><text x="52" y="403" font-size="17" fill="#aab8c9" font-weight="400">Show the conversation to people.</text><path d="M620 287V311" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="315" width="376" height="154" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="452" y="347" font-size="21" fill="#8bb9ff" font-weight="600">For the model</text><text x="452" y="379" font-size="17" fill="#aab8c9" font-weight="400">Read messages and checkpoints.</text><text x="452" y="403" font-size="17" fill="#aab8c9" font-weight="400">Then pair tools and filter browser</text><text x="452" y="427" font-size="17" fill="#aab8c9" font-weight="400">images.</text><text x="32" y="499" font-size="16" fill="#aab8c9" font-weight="400">These are views of the same records, not two independently edited histories.</text></g></svg>