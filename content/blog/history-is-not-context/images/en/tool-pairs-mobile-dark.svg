<svg xmlns="http://www.w3.org/2000/svg" width="440" height="884" viewBox="0 0 440 884" role="img" aria-labelledby="title"><title id="title">What enters the next turn</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="884" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">02 / TOOL CALL PAIRING</text><text x="32" y="82" font-size="26" fill="#e5ebf3" font-weight="600">What enters the next turn</text><rect x="32" y="162" width="376" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="194" font-size="21" fill="#8bb9ff" font-weight="600">Scan calls and results</text><text x="52" y="226" font-size="17" fill="#aab8c9" font-weight="400">Match by ID; the result must follow</text><text x="52" y="250" font-size="17" fill="#aab8c9" font-weight="400">its call.</text><path d="M220 282V306H20V698" fill="none" stroke="#627184" stroke-width="2"/><path d="M20 382H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="342" width="344" height="135" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="84" y="374" font-size="21" fill="#8bb9ff" font-weight="600">Call + later result</text><text x="84" y="406" font-size="17" fill="#aab8c9" font-weight="400">test-1 matches test-1</text><text x="84" y="430" font-size="17" fill="#aab8c9" font-weight="400">Keep the completed pair.</text><path d="M20 540H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="500" width="344" height="135" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="532" font-size="21" fill="#e5ebf3" font-weight="600">Call without a result</text><text x="84" y="564" font-size="17" fill="#aab8c9" font-weight="400">patch-1 has no result</text><text x="84" y="588" font-size="17" fill="#aab8c9" font-weight="400">Remove the orphan call.</text><path d="M20 698H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="658" width="344" height="135" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="690" font-size="21" fill="#e5ebf3" font-weight="600">Result without a call</text><text x="84" y="722" font-size="17" fill="#aab8c9" font-weight="400">No call for stale-1</text><text x="84" y="746" font-size="17" fill="#aab8c9" font-weight="400">Remove the orphan result.</text><text x="32" y="818" font-size="16" fill="#aab8c9" font-weight="400">Removing a record from model input does</text><text x="32" y="841" font-size="16" fill="#aab8c9" font-weight="400">not undo the action.</text></g></svg>