<svg xmlns="http://www.w3.org/2000/svg" width="440" height="840" viewBox="0 0 440 840" role="img" aria-labelledby="title"><title id="title">同一份历史，不同的读取规则</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="840" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">02 / HISTORY PROJECTION</text><text x="32" y="85" font-size="25" fill="#e5ebf3" font-weight="600">记录怎样成为上下文</text><rect x="32" y="125" width="376" height="100" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="159" font-size="21" fill="#e5ebf3" font-weight="600">保存的会话记录</text><text x="52" y="190" font-size="17" fill="#aab8c9" font-weight="400">消息、工具结果、元数据、检查点</text><path d="M220 225V265" fill="none" stroke="#627184" stroke-width="2"/><path d="M220 265H22V514" fill="none" stroke="#627184" stroke-width="2"/><path d="M22 335H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="282" width="344" height="120" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="316" font-size="21" fill="#e5ebf3" font-weight="600">展示给人</text><text x="84" y="347" font-size="17" fill="#aab8c9" font-weight="400">按展示规则读取</text><text x="84" y="372" font-size="17" fill="#aab8c9" font-weight="400">保留可回看的对话内容</text><path d="M22 514H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="445" width="344" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="84" y="479" font-size="21" fill="#8bb9ff" font-weight="600">提供给模型</text><text x="84" y="510" font-size="17" fill="#aab8c9" font-weight="400">识别消息与压缩边界</text><text x="84" y="535" font-size="17" fill="#aab8c9" font-weight="400">跳过非模型记录</text><path d="M236 565V610" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="612" width="344" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="84" y="646" font-size="21" fill="#8bb9ff" font-weight="600">继续整理</text><text x="84" y="677" font-size="17" fill="#aab8c9" font-weight="400">工具调用配对</text><text x="84" y="702" font-size="17" fill="#aab8c9" font-weight="400">旧浏览器截图改为文字说明</text><text x="32" y="793" font-size="18" fill="#aab8c9" font-weight="400">模型上下文只是一种读取结果。</text></g></svg>