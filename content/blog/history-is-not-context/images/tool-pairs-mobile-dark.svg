<svg xmlns="http://www.w3.org/2000/svg" width="440" height="970" viewBox="0 0 440 970" role="img" aria-labelledby="title"><title id="title">工具调用和结果必须配对</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="970" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">02 / TOOL CALL PAIRING</text><text x="32" y="85" font-size="25" fill="#e5ebf3" font-weight="600">哪些记录进入下一轮</text><rect x="32" y="128" width="376" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="162" font-size="21" fill="#e5ebf3" font-weight="600">测试：调用 + 后续结果</text><text x="52" y="193" font-size="17" fill="#aab8c9" font-weight="400">test-1 ↔ test-1</text><path d="M220 219V246" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="248" width="376" height="91" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="282" font-size="21" fill="#8bb9ff" font-weight="600">保留完整配对</text><text x="52" y="313" font-size="17" fill="#aab8c9" font-weight="400">模型能看到测试失败</text><rect x="32" y="382" width="376" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="416" font-size="21" fill="#e5ebf3" font-weight="600">修改：只有调用</text><text x="52" y="447" font-size="17" fill="#aab8c9" font-weight="400">patch-1 → 没有结果</text><path d="M220 473V500" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="502" width="376" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="536" font-size="21" fill="#e5ebf3" font-weight="600">移除孤立调用</text><text x="52" y="567" font-size="17" fill="#aab8c9" font-weight="400">不把缺失结果猜成失败</text><rect x="32" y="636" width="376" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="670" font-size="21" fill="#e5ebf3" font-weight="600">旧结果：没有对应调用</text><text x="52" y="701" font-size="17" fill="#aab8c9" font-weight="400">没有调用 → stale-1</text><path d="M220 727V754" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="756" width="376" height="91" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="790" font-size="21" fill="#e5ebf3" font-weight="600">移除孤立结果</text><text x="52" y="821" font-size="17" fill="#aab8c9" font-weight="400">不让结果失去来源</text><text x="32" y="936" font-size="17" fill="#aab8c9" font-weight="400">移出模型输入 ≠ 撤销已经发生的动作</text></g></svg>