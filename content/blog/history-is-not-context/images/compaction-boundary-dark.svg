<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660" role="img" aria-labelledby="title"><title id="title">后一个压缩检查点成为新的起点</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="840" height="660" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500">02 / COMPACTION BOUNDARY</text><text x="32" y="85" font-size="30" fill="#e5ebf3" font-weight="600">从最近的有效检查点继续</text><rect x="32" y="128" width="776" height="114" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="162" font-size="21" fill="#e5ebf3" font-weight="600">01  读到检查点 A</text><text x="52" y="193" font-size="17" fill="#aab8c9" font-weight="400">当前结果替换为 A.messages</text><text x="52" y="222" font-size="17" fill="#aab8c9" font-weight="400">旧消息已由这个快照承接</text><path d="M420 242V275" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="286" width="776" height="114" rx="12" fill="#1d2733" stroke="#627184"/><text x="52" y="320" font-size="21" fill="#e5ebf3" font-weight="600">02  继续聊天，再遇到 B</text><text x="52" y="351" font-size="17" fill="#aab8c9" font-weight="400">当前结果替换为 B.messages</text><text x="52" y="380" font-size="17" fill="#aab8c9" font-weight="400">不再重复拼入 A 与更早的原文</text><path d="M420 400V433" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="444" width="776" height="114" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="478" font-size="21" fill="#8bb9ff" font-weight="600">03  读到 B 后的新消息</text><text x="52" y="509" font-size="17" fill="#aab8c9" font-weight="400">最终：B.messages + 新消息</text><text x="52" y="538" font-size="17" fill="#aab8c9" font-weight="400">最后再检查工具配对和浏览器图片</text></g></svg>