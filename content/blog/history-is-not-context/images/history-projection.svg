<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title"><title id="title">同一份历史，不同的读取规则</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="600" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500">02 / HISTORY PROJECTION</text><text x="32" y="85" font-size="30" fill="#17212f" font-weight="600">记录怎样成为上下文</text><rect x="32" y="230" width="252" height="132" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="264" font-size="21" fill="#17212f" font-weight="600">保存的会话记录</text><text x="52" y="295" font-size="17" fill="#526071" font-weight="400">消息、工具结果</text><text x="52" y="320" font-size="17" fill="#526071" font-weight="400">元数据、压缩检查点</text><path d="M284 296H320V196H358" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 296V382H358" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="130" width="448" height="118" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="380" y="164" font-size="21" fill="#17212f" font-weight="600">展示给人</text><text x="380" y="195" font-size="17" fill="#526071" font-weight="400">按展示规则读取对话内容</text><rect x="360" y="310" width="448" height="138" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="380" y="344" font-size="21" fill="#245dc5" font-weight="600">提供给模型</text><text x="380" y="375" font-size="17" fill="#526071" font-weight="400">识别消息与压缩边界</text><text x="380" y="400" font-size="17" fill="#526071" font-weight="400">再进行工具配对与截图筛选</text><text x="32" y="530" font-size="20" fill="#526071" font-weight="400">原始记录没有变成两份各自修改的历史。</text></g></svg>