<svg xmlns="http://www.w3.org/2000/svg" width="440" height="830" viewBox="0 0 440 830" role="img" aria-labelledby="title"><title id="title">后一个压缩检查点成为新的起点</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="440" height="830" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500">02 / COMPACTION BOUNDARY</text><text x="32" y="85" font-size="25" fill="#17212f" font-weight="600">从最近的有效检查点继续</text><rect x="32" y="128" width="376" height="148" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="162" font-size="21" fill="#17212f" font-weight="600">01  读到检查点 A</text><text x="52" y="193" font-size="17" fill="#526071" font-weight="400">当前结果替换为 A.messages</text><text x="52" y="240" font-size="16" fill="#526071" font-weight="400">旧消息已由这个快照承接</text><path d="M220 276V335" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="346" width="376" height="148" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="380" font-size="21" fill="#17212f" font-weight="600">02  继续聊天，再遇到 B</text><text x="52" y="411" font-size="17" fill="#526071" font-weight="400">当前结果替换为 B.messages</text><text x="52" y="458" font-size="16" fill="#526071" font-weight="400">不再重复拼入 A 与更早的原文</text><path d="M220 494V553" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="564" width="376" height="148" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="598" font-size="21" fill="#245dc5" font-weight="600">03  读到 B 后的新消息</text><text x="52" y="629" font-size="17" fill="#526071" font-weight="400">最终：B.messages + 新消息</text><text x="52" y="676" font-size="16" fill="#526071" font-weight="400">最后再检查工具配对和浏览器图片</text><text x="32" y="805" font-size="17" fill="#526071" font-weight="400">结构检查通过，不代表摘要没有遗漏。</text></g></svg>