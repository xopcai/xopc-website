<svg xmlns="http://www.w3.org/2000/svg" width="840" height="680" viewBox="0 0 840 680" role="img" aria-labelledby="title"><title id="title">工具调用和结果必须配对</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="680" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500">02 / TOOL CALL PAIRING</text><text x="32" y="85" font-size="30" fill="#17212f" font-weight="600">哪些记录进入下一轮</text><rect x="32" y="143" width="350" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="177" font-size="21" fill="#17212f" font-weight="600">测试：调用 + 后续结果</text><text x="52" y="208" font-size="17" fill="#526071" font-weight="400">test-1 ↔ test-1</text><path d="M382 193H456" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="458" y="143" width="350" height="100" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="478" y="177" font-size="21" fill="#245dc5" font-weight="600">保留完整配对</text><text x="478" y="208" font-size="17" fill="#526071" font-weight="400">模型能看到测试失败</text><rect x="32" y="293" width="350" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="327" font-size="21" fill="#17212f" font-weight="600">修改：只有调用</text><text x="52" y="358" font-size="17" fill="#526071" font-weight="400">patch-1 → 没有结果</text><path d="M382 343H456" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="458" y="293" width="350" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="478" y="327" font-size="21" fill="#17212f" font-weight="600">移除孤立调用</text><text x="478" y="358" font-size="17" fill="#526071" font-weight="400">不把缺失结果猜成失败</text><rect x="32" y="443" width="350" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="52" y="477" font-size="21" fill="#17212f" font-weight="600">旧结果：没有对应调用</text><text x="52" y="508" font-size="17" fill="#526071" font-weight="400">没有调用 → stale-1</text><path d="M382 493H456" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="458" y="443" width="350" height="100" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="478" y="477" font-size="21" fill="#17212f" font-weight="600">移除孤立结果</text><text x="478" y="508" font-size="17" fill="#526071" font-weight="400">不让结果失去来源</text><text x="32" y="640" font-size="20" fill="#526071" font-weight="400">移出模型输入 ≠ 撤销已经发生的动作</text></g></svg>