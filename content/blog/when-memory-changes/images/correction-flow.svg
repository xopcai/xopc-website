<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" role="img" aria-labelledby="title desc"><title id="title">同一条偏好，三种处理结果</title><desc id="desc">明确纠正且值改变时替代旧记录；重复值去重；没有明确纠正关系的不同值需要进一步协调权限和冲突。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#c8d2df" stroke-width="1.4"/></marker></defs><rect width="840" height="690" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500" text-anchor="start">02 / RECONCILIATION</text><text x="32" y="84" font-size="30" fill="#17212f" font-weight="600" text-anchor="start">同一条偏好，三种处理结果</text><rect x="226" y="130" width="388" height="90" rx="10" fill="#edf3ff" stroke="#245dc5"/><text x="420" y="168" font-size="23" fill="#245dc5" font-weight="500" text-anchor="middle">新信息 → 同一个事实位置</text><text x="420" y="199" font-size="17" fill="#526071" font-weight="400" text-anchor="middle">先解析对象、属性和范围</text><path d="M420 220V263M152 263H688" fill="none" stroke="#c8d2df" stroke-width="2"/><path d="M148 263V306" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="308" width="232" height="105" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="148" y="347" font-size="18" fill="#17212f" font-weight="600" text-anchor="middle">明确纠正，取值改变</text><text x="148" y="383" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">校验用户权限与原记录</text><path d="M148 413V466" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="468" width="232" height="110" rx="10" fill="#edf3ff" stroke="#245dc5"/><text x="148" y="510" font-size="21" fill="#245dc5" font-weight="500" text-anchor="middle">创建新记录</text><text x="148" y="546" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">关联旧记录，并将其归档</text><path d="M420 263V306" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="308" width="232" height="105" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="420" y="347" font-size="18" fill="#17212f" font-weight="600" text-anchor="middle">重复表达，取值相同</text><text x="420" y="383" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">复用已有记录</text><path d="M420 413V466" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="468" width="232" height="110" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="420" y="510" font-size="21" fill="#245dc5" font-weight="500" text-anchor="middle">补充支持证据</text><text x="420" y="546" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">避免积累重复的偏好</text><path d="M692 263V306" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="308" width="232" height="105" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="692" y="347" font-size="18" fill="#17212f" font-weight="600" text-anchor="middle">取值不同，无明确纠正</text><text x="692" y="383" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">继续比较信息的权威性</text><path d="M692 413V466" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="468" width="232" height="110" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="692" y="510" font-size="21" fill="#245dc5" font-weight="500" text-anchor="middle">不能直接替代时</text><text x="692" y="546" font-size="16" fill="#526071" font-weight="400" text-anchor="middle">进入待复核或冲突状态</text><text x="32" y="623" font-size="18" fill="#526071" font-weight="400" text-anchor="start">明确纠正先于普通去重处理；纠正后的值相同则复用原记录。</text><text x="32" y="654" font-size="16" fill="#526071" font-weight="400" text-anchor="start">图示为单值偏好的典型路径，不包含所有状态分支。</text></g></svg>