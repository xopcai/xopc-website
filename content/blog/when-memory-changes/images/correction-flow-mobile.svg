<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1050" viewBox="0 0 440 1050" role="img" aria-labelledby="title desc"><title id="title">同一条偏好，三种处理结果</title><desc id="desc">明确纠正且值改变时替代旧记录；重复值去重；没有明确纠正关系的不同值需要进一步协调权限和冲突。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#c8d2df" stroke-width="1.4"/></marker></defs><rect width="440" height="1050" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500" text-anchor="start">02 / RECONCILIATION</text><text x="32" y="84" font-size="23" fill="#17212f" font-weight="600" text-anchor="start">同一条偏好，三种处理结果</text><rect x="64" y="124" width="344" height="88" rx="10" fill="#edf3ff" stroke="#245dc5"/><text x="86" y="158" font-size="19" fill="#245dc5" font-weight="500" text-anchor="start">新信息 → 同一个事实位置</text><text x="86" y="187" font-size="16" fill="#526071" font-weight="400" text-anchor="start">先解析对象、属性和范围</text><path d="M64 168H30V841" fill="none" stroke="#c8d2df" stroke-width="2"/><path d="M30 286H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="246" width="344" height="212" rx="10" fill="#edf3ff" stroke="#245dc5"/><text x="84" y="280" font-size="19" fill="#17212f" font-weight="600" text-anchor="start">明确纠正，取值改变</text><text x="84" y="311" font-size="16" fill="#526071" font-weight="400" text-anchor="start">校验用户权限与原记录</text><path d="M236 328V361" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><text x="84" y="395" font-size="20" fill="#245dc5" font-weight="500" text-anchor="start">创建新记录</text><text x="84" y="427" font-size="16" fill="#526071" font-weight="400" text-anchor="start">关联旧记录，并将其归档</text><path d="M30 530H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="490" width="344" height="212" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="84" y="524" font-size="19" fill="#17212f" font-weight="600" text-anchor="start">重复表达，取值相同</text><text x="84" y="555" font-size="16" fill="#526071" font-weight="400" text-anchor="start">复用已有记录</text><path d="M236 572V605" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><text x="84" y="639" font-size="20" fill="#245dc5" font-weight="500" text-anchor="start">补充支持证据</text><text x="84" y="671" font-size="16" fill="#526071" font-weight="400" text-anchor="start">避免积累重复的偏好</text><path d="M30 774H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="734" width="344" height="212" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="84" y="768" font-size="19" fill="#17212f" font-weight="600" text-anchor="start">取值不同，无明确纠正</text><text x="84" y="799" font-size="16" fill="#526071" font-weight="400" text-anchor="start">继续比较信息的权威性</text><path d="M236 816V849" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><text x="84" y="883" font-size="20" fill="#245dc5" font-weight="500" text-anchor="start">不能直接替代时</text><text x="84" y="915" font-size="16" fill="#526071" font-weight="400" text-anchor="start">进入待复核或冲突状态</text><text x="32" y="1003" font-size="16" fill="#526071" font-weight="400" text-anchor="start">图示为单值偏好的典型路径。</text></g></svg>