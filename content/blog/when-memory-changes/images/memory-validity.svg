<svg xmlns="http://www.w3.org/2000/svg" width="840" height="670" viewBox="0 0 840 670" role="img" aria-labelledby="title desc"><title id="title">保留历史，也停止使用过期信息</title><desc id="desc">一次纠正连接两段有效期；使用前检查会即时排除过期记录，无须等待后台维护。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#c8d2df" stroke-width="1.4"/></marker></defs><rect width="840" height="670" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500" text-anchor="start">03 / VALIDITY &amp; TIME</text><text x="32" y="84" font-size="30" fill="#17212f" font-weight="600" text-anchor="start">记忆存在，不代表仍然有效</text><text x="48" y="142" font-size="19" fill="#17212f" font-weight="600" text-anchor="start">A / 一次明确纠正前后</text><path d="M48 197H808" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><circle cx="424" cy="197" r="5" fill="#245dc5"/><text x="424" y="181" font-size="16" fill="#245dc5" font-weight="500" text-anchor="middle">纠正时刻</text><rect x="48" y="226" width="368" height="60" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="62" y="263" font-size="20" fill="#526071" font-weight="500" text-anchor="start">旧偏好</text><rect x="432" y="305" width="376" height="60" rx="10" fill="#edf3ff" stroke="#245dc5"/><text x="446" y="342" font-size="20" fill="#245dc5" font-weight="500" text-anchor="start">新偏好</text><path d="M424 202V385" fill="none" stroke="#c8d2df" stroke-width="2" stroke-dasharray="5 6"/><text x="48" y="410" font-size="19" fill="#526071" font-weight="400" text-anchor="start">旧记录保留在历史中，新记录接续生效。</text><text x="48" y="466" font-size="19" fill="#17212f" font-weight="600" text-anchor="start">B / 到期检查不等待后台维护</text><path d="M48 535H808" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><circle cx="130" cy="535" r="5" fill="#245dc5"/><text x="130" y="512" font-size="18" fill="#17212f" font-weight="500" text-anchor="middle">10:00</text><circle cx="420" cy="535" r="5" fill="#245dc5"/><text x="420" y="512" font-size="18" fill="#17212f" font-weight="500" text-anchor="middle">10:30</text><circle cx="710" cy="535" r="5" fill="#245dc5"/><text x="710" y="512" font-size="18" fill="#17212f" font-weight="500" text-anchor="middle">11:00</text><text x="130" y="576" font-size="19" fill="#17212f" font-weight="500" text-anchor="middle">记忆到期</text><text x="130" y="606" font-size="17" fill="#526071" font-weight="400" text-anchor="middle">停止适用</text><text x="420" y="576" font-size="19" fill="#245dc5" font-weight="500" text-anchor="middle">本轮回答前检查</text><text x="420" y="606" font-size="17" fill="#526071" font-weight="400" text-anchor="middle">已排除过期记录</text><text x="710" y="576" font-size="19" fill="#17212f" font-weight="500" text-anchor="middle">后台维护</text><text x="710" y="606" font-size="17" fill="#526071" font-weight="400" text-anchor="middle">清理或更新状态</text></g></svg>