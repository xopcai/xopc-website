<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1027" viewBox="0 0 440 1027" role="img" aria-labelledby="title"><title id="title">One preference, different outcomes</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#627184" stroke-width="1.4"/></marker></defs><rect width="440" height="1027" rx="16" fill="#151c25"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#aab8c9" font-weight="500">01 / RECONCILIATION</text><text x="32" y="82" font-size="26" fill="#e5ebf3" font-weight="600">One preference, different</text><text x="32" y="116" font-size="26" fill="#e5ebf3" font-weight="600">outcomes</text><rect x="32" y="162" width="376" height="120" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="52" y="194" font-size="21" fill="#8bb9ff" font-weight="600">Resolve the same fact slot</text><text x="52" y="226" font-size="17" fill="#aab8c9" font-weight="400">Subject, attribute, and scope</text><text x="52" y="250" font-size="17" fill="#aab8c9" font-weight="400">identify the slot.</text><path d="M220 282V306H20V770" fill="none" stroke="#627184" stroke-width="2"/><path d="M20 382H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="342" width="344" height="183" rx="12" fill="#213652" stroke="#8bb9ff"/><text x="84" y="374" font-size="21" fill="#8bb9ff" font-weight="600">Explicit correction</text><text x="84" y="406" font-size="17" fill="#aab8c9" font-weight="400">Value changes</text><text x="84" y="430" font-size="17" fill="#aab8c9" font-weight="400">Validate authority and target.</text><text x="84" y="454" font-size="17" fill="#aab8c9" font-weight="400">Create a new record; archive the</text><text x="84" y="478" font-size="17" fill="#aab8c9" font-weight="400">old one.</text><path d="M20 588H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="548" width="344" height="159" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="580" font-size="21" fill="#e5ebf3" font-weight="600">Repeated value</text><text x="84" y="612" font-size="17" fill="#aab8c9" font-weight="400">Value stays the same</text><text x="84" y="636" font-size="17" fill="#aab8c9" font-weight="400">Reuse the record.</text><text x="84" y="660" font-size="17" fill="#aab8c9" font-weight="400">Add supporting evidence.</text><path d="M20 770H62" fill="none" stroke="#627184" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="730" width="344" height="183" rx="12" fill="#1d2733" stroke="#627184"/><text x="84" y="762" font-size="21" fill="#e5ebf3" font-weight="600">Different value</text><text x="84" y="794" font-size="17" fill="#aab8c9" font-weight="400">No explicit correction</text><text x="84" y="818" font-size="17" fill="#aab8c9" font-weight="400">Compare authority.</text><text x="84" y="842" font-size="17" fill="#aab8c9" font-weight="400">Review or flag conflicts when</text><text x="84" y="866" font-size="17" fill="#aab8c9" font-weight="400">replacement is not justified.</text><text x="32" y="938" font-size="16" fill="#aab8c9" font-weight="400">An explicit correction with the same</text><text x="32" y="961" font-size="16" fill="#aab8c9" font-weight="400">value reuses the record. These are</text><text x="32" y="984" font-size="16" fill="#aab8c9" font-weight="400">typical single-value paths.</text></g></svg>