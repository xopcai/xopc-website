<svg xmlns="http://www.w3.org/2000/svg" width="840" height="661" viewBox="0 0 840 661" role="img" aria-labelledby="title"><title id="title">One preference, different outcomes</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="661" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">01 / RECONCILIATION</text><text x="32" y="82" font-size="30" fill="#17212f" font-weight="600">One preference, different outcomes</text><rect x="32" y="135" width="776" height="120" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="167" font-size="21" fill="#245dc5" font-weight="600">Resolve the same fact slot</text><text x="52" y="199" font-size="17" fill="#526071" font-weight="400">Subject, attribute, and scope identify the slot.</text><path d="M420 255V287" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M153.33333333333331 287H686.6666666666666" fill="none" stroke="#b7c4d4" stroke-width="2"/><path d="M153.33333333333331 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="315" width="242.66666666666666" height="250" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="52" y="347" font-size="21" fill="#245dc5" font-weight="600">Explicit</text><text x="52" y="374" font-size="21" fill="#245dc5" font-weight="600">correction</text><text x="52" y="406" font-size="17" fill="#526071" font-weight="400">Value changes</text><text x="52" y="430" font-size="17" fill="#526071" font-weight="400">Validate authority</text><text x="52" y="454" font-size="17" fill="#526071" font-weight="400">and target.</text><text x="52" y="478" font-size="17" fill="#526071" font-weight="400">Create a new record;</text><text x="52" y="502" font-size="17" fill="#526071" font-weight="400">archive the old one.</text><path d="M419.99999999999994 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="298.66666666666663" y="315" width="242.66666666666666" height="250" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="318.66666666666663" y="347" font-size="21" fill="#17212f" font-weight="600">Repeated value</text><text x="318.66666666666663" y="379" font-size="17" fill="#526071" font-weight="400">Value stays the same</text><text x="318.66666666666663" y="403" font-size="17" fill="#526071" font-weight="400">Reuse the record.</text><text x="318.66666666666663" y="427" font-size="17" fill="#526071" font-weight="400">Add supporting</text><text x="318.66666666666663" y="451" font-size="17" fill="#526071" font-weight="400">evidence.</text><path d="M686.6666666666666 287V311" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><rect x="565.3333333333333" y="315" width="242.66666666666666" height="250" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="585.3333333333333" y="347" font-size="21" fill="#17212f" font-weight="600">Different value</text><text x="585.3333333333333" y="379" font-size="17" fill="#526071" font-weight="400">No explicit</text><text x="585.3333333333333" y="403" font-size="17" fill="#526071" font-weight="400">correction</text><text x="585.3333333333333" y="427" font-size="17" fill="#526071" font-weight="400">Compare authority.</text><text x="585.3333333333333" y="451" font-size="17" fill="#526071" font-weight="400">Review or flag</text><text x="585.3333333333333" y="475" font-size="17" fill="#526071" font-weight="400">conflicts when</text><text x="585.3333333333333" y="499" font-size="17" fill="#526071" font-weight="400">replacement is not</text><text x="585.3333333333333" y="523" font-size="17" fill="#526071" font-weight="400">justified.</text><text x="32" y="595" font-size="16" fill="#526071" font-weight="400">An explicit correction with the same value reuses the record. These are typical</text><text x="32" y="618" font-size="16" fill="#526071" font-weight="400">single-value paths.</text></g></svg>