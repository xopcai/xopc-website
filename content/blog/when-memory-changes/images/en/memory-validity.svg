<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title"><title id="title">Validity is checked before use</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="840" height="600" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">01 / VALIDITY &amp; TIME</text><text x="32" y="82" font-size="30" fill="#17212f" font-weight="600">Validity is checked before use</text><text x="32" y="144" font-size="20" fill="#17212f" font-weight="600">A / An explicit correction</text><path d="M40 195H800" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 195V391" fill="none" stroke="#b7c4d4" stroke-width="2"/><text x="371" y="179" font-size="17" fill="#245dc5" font-weight="500">Correction</text><rect x="40" y="221" width="372" height="67" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="55" y="262" font-size="19" fill="#526071" font-weight="400">Old value</text><rect x="428" y="311" width="372" height="67" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="442" y="353" font-size="19" fill="#245dc5" font-weight="400">New value</text><text x="32" y="427" font-size="20" fill="#526071" font-weight="400">Old record retained; new value takes effect.</text><text x="32" y="492" font-size="20" fill="#17212f" font-weight="600">B / Expiry does not wait for maintenance</text><path d="M40 541H800" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="525" font-size="21" fill="#17212f" font-weight="500">10:00</text><text x="40" y="576" font-size="18" fill="#526071" font-weight="400">Expires</text><text x="380" y="525" font-size="21" fill="#17212f" font-weight="500">10:30</text><text x="380" y="576" font-size="18" fill="#245dc5" font-weight="400">Excluded</text><text x="720" y="525" font-size="21" fill="#17212f" font-weight="500">11:00</text><text x="720" y="576" font-size="18" fill="#526071" font-weight="400">Maintenance</text></g></svg>