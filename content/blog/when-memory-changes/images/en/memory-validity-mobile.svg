<svg xmlns="http://www.w3.org/2000/svg" width="440" height="840" viewBox="0 0 440 840" role="img" aria-labelledby="title"><title id="title">Validity is checked before use</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7c4d4" stroke-width="1.4"/></marker></defs><rect width="440" height="840" rx="16" fill="#fafbfc"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="40" font-size="13" fill="#526071" font-weight="500">01 / VALIDITY &amp; TIME</text><text x="32" y="82" font-size="26" fill="#17212f" font-weight="600">Validity is checked before</text><text x="32" y="116" font-size="26" fill="#17212f" font-weight="600">use</text><text x="32" y="177" font-size="20" fill="#17212f" font-weight="600">A / An explicit correction</text><path d="M40 232H400" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 232V428" fill="none" stroke="#b7c4d4" stroke-width="2"/><text x="171" y="216" font-size="17" fill="#245dc5" font-weight="500">Correction</text><rect x="40" y="258" width="172" height="67" rx="12" fill="#ffffff" stroke="#b7c4d4"/><text x="55" y="299" font-size="19" fill="#526071" font-weight="400">Old value</text><rect x="228" y="348" width="172" height="67" rx="12" fill="#edf3ff" stroke="#245dc5"/><text x="242" y="390" font-size="19" fill="#245dc5" font-weight="400">New value</text><text x="32" y="464" font-size="17" fill="#526071" font-weight="400">Old record retained; new value takes effect.</text><text x="32" y="529" font-size="18" fill="#17212f" font-weight="600">B / Expiry does not wait for maintenance</text><path d="M40 578H400" fill="none" stroke="#b7c4d4" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="562" font-size="18" fill="#17212f" font-weight="500">10:00</text><text x="40" y="613" font-size="15" fill="#526071" font-weight="400">Expires</text><text x="180" y="562" font-size="18" fill="#17212f" font-weight="500">10:30</text><text x="180" y="613" font-size="15" fill="#245dc5" font-weight="400">Excluded</text><text x="320" y="562" font-size="18" fill="#17212f" font-weight="500">11:00</text><text x="320" y="613" font-size="15" fill="#526071" font-weight="400">Maintenance</text><text x="32" y="674" font-size="17" fill="#526071" font-weight="400">The answer at 10:30 already excludes</text><text x="32" y="699" font-size="17" fill="#526071" font-weight="400">the record, before maintenance runs.</text></g></svg>