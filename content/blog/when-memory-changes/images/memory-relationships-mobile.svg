<svg xmlns="http://www.w3.org/2000/svg" width="440" height="940" viewBox="0 0 440 940" role="img" aria-labelledby="title desc"><title id="title">来源与理解分开保存</title><desc id="desc">来源证据关联到五类持久信息；各类信息按自己的规则被选入当前上下文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#c8d2df" stroke-width="1.4"/></marker></defs><rect width="440" height="940" rx="16" fill="#fafbfc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#526071" font-weight="500" text-anchor="start">01 / MEMORY MODEL</text><text x="32" y="84" font-size="25" fill="#17212f" font-weight="600" text-anchor="start">来源与理解分开保存</text><rect x="64" y="122" width="344" height="96" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="88" y="158" font-size="21" fill="#17212f" font-weight="600" text-anchor="start">来源证据</text><text x="88" y="190" font-size="17" fill="#526071" font-weight="400" text-anchor="start">对话、来源引用与观察时间</text><path d="M64 170H30V704" fill="none" stroke="#c8d2df" stroke-width="2"/><path d="M30 288H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="252" width="344" height="76" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="84" y="282" font-size="20" fill="#17212f" font-weight="500" text-anchor="start">用户陈述</text><text x="84" y="309" font-size="16" fill="#526071" font-weight="400" text-anchor="start">身份、偏好与习惯</text><path d="M30 382H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="346" width="344" height="76" rx="10" fill="#ffffff" stroke="#c8d2df"/><text x="84" y="376" font-size="20" fill="#17212f" font-weight="500" text-anchor="start">长期目标</text><text x="84" y="403" font-size="16" fill="#526071" font-weight="400" text-anchor="start">希望达成的结果</text><path d="M30 476H62" fill="none" stroke="#c8d2df" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="440" width="344" hei