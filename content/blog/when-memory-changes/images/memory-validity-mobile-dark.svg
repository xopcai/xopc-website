<svg xmlns="http://www.w3.org/2000/svg" width="440" height="850" viewBox="0 0 440 850" role="img" aria-labelledby="title desc"><title id="title">保留历史，也停止使用过期信息</title><desc id="desc">一次纠正连接两段有效期；使用前检查会即时排除过期记录，无须等待后台维护。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#506074" stroke-width="1.4"/></marker></defs><rect width="440" height="850" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500" text-anchor="start">03 / VALIDITY &amp; TIME</text><text x="32" y="84" font-size="23" fill="#e5ebf3" font-weight="600" text-anchor="start">记忆存在，不代表仍然有效</text><text x="32" y="142" font-size="19" fill="#e5ebf3" font-weight="600" text-anchor="start">A / 一次明确纠正前后</text><path d="M32 197H408" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><circle cx="210" cy="197" r="5" fill="#8bb9ff"/><text x="210" y="181" font-size="16" fill="#8bb9ff" font-weight="500" text-anchor="middle">纠正时刻</text><rect x="32" y="226" width="170" height="60" rx="10" fill="#1d2733" stroke="#506074"/><text x="46" y="263" font-size="20" fill="#aab8c9" font-weight="500" text-anchor="start">旧偏好</text><rect x="218" y="305" width="190" height="60" rx="10" fill="#213652" stroke="#8bb9ff"/><text x="232" y="342" font-size="20" fill="#8bb9ff" font-weight="500" text-anchor="start">新偏好</text><path d="M210 202V385" fill="none" stroke="#506074" stroke-width="2" stroke-dasharray="5 6"/><text x="32" y="410" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">旧记录保留在历史中，新记录接续生效。</text><text x="32" y="486" font-size="18" fill="#e5ebf3" font-weight="600" text-anchor="start">B / 到期检查不等待后台维护</text><path d="M32 555H408" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><circle cx="68" cy="555" r="5" fill="#8bb9ff"/><text x="68" y="532" font-size="18" fill="#e5ebf3" font-weight="500" text-anchor="middle">10:00</text><circle cx="220" cy="555" r="5" fill="#8bb9ff"/><text x="220" y="532" font-size="18" fill="#e5ebf3" font-weight="500" text-anchor="middle">10:30</text><circle cx="368" cy="555" r="5" fill="#8bb9ff"/><text x="368" y="532" font-size="18" fill="#e5ebf3" font-weight="500" text-anchor="middle">11:00</text><text x="68" y="596" font-size="17" fill="#e5ebf3" font-weight="500" text-anchor="middle">记忆到期</text><text x="68" y="626" font-size="15" fill="#aab8c9" font-weight="400" text-anchor="middle">停止适用</text><text x="220" y="596" font-size="17" fill="#8bb9ff" font-weight="500" text-anchor="middle">本轮回答</text><text x="220" y="626" font-size="15" fill="#aab8c9" font-weight="400" text-anchor="middle">已被排除</text><text x="368" y="596" font-size="17" fill="#e5ebf3" font-weight="500" text-anchor="middle">后台维护</text><text x="368" y="626" font-size="15" fill="#aab8c9" font-weight="400" text-anchor="middle">更新状态</text><rect x="32" y="696" width="376" height="100" rx="10" fill="#213652" stroke="#8bb9ff"/><text x="52" y="733" font-size="20" fill="#8bb9ff" font-weight="500" text-anchor="start">10:30 的回答无需等到 11:00</text><text x="52" y="768" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">使用资格会在每次选择信息时检查。</text></g></svg>