<svg xmlns="http://www.w3.org/2000/svg" width="840" height="670" viewBox="0 0 840 670" role="img" aria-labelledby="title desc"><title id="title">来源与理解分开保存</title><desc id="desc">来源证据关联到五类持久信息；各类信息按自己的规则被选入当前上下文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#506074" stroke-width="1.4"/></marker></defs><rect width="840" height="670" rx="16" fill="#151c25"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="32" y="42" font-size="13" fill="#aab8c9" font-weight="500" text-anchor="start">01 / MEMORY MODEL</text><text x="32" y="84" font-size="30" fill="#e5ebf3" font-weight="600" text-anchor="start">来源与理解分开保存</text><rect x="32" y="284" width="225" height="116" rx="10" fill="#1d2733" stroke="#506074"/><text x="56" y="329" font-size="23" fill="#e5ebf3" font-weight="600" text-anchor="start">来源证据</text><text x="56" y="363" font-size="18" fill="#aab8c9" font-weight="400" text-anchor="start">对话与来源引用</text><path d="M257 342H302M302 169V513" fill="none" stroke="#506074" stroke-width="2"/><text x="279" y="138" font-size="15" fill="#aab8c9" font-weight="400" text-anchor="start">关联</text><path d="M302 169H344" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="132" width="328" height="74" rx="10" fill="#1d2733" stroke="#506074"/><text x="366" y="162" font-size="21" fill="#e5ebf3" font-weight="500" text-anchor="start">用户陈述</text><text x="366" y="189" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">身份、偏好与习惯</text><path d="M674 169H722" fill="none" stroke="#506074" stroke-width="2"/><path d="M302 255H344" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="218" width="328" height="74" rx="10" fill="#1d2733" stroke="#506074"/><text x="366" y="248" font-size="21" fill="#e5ebf3" font-weight="500" text-anchor="start">长期目标</text><text x="366" y="275" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">希望达成的结果</text><path d="M674 255H722" fill="none" stroke="#506074" stroke-width="2"/><path d="M302 341H344" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="304" width="328" height="74" rx="10" fill="#1d2733" stroke="#506074"/><text x="366" y="334" font-size="21" fill="#e5ebf3" font-weight="500" text-anchor="start">阶段优先级</text><text x="366" y="361" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">在一段时间内优先做什么</text><path d="M674 341H722" fill="none" stroke="#506074" stroke-width="2"/><path d="M302 427H344" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="390" width="328" height="74" rx="10" fill="#1d2733" stroke="#506074"/><text x="366" y="420" font-size="21" fill="#e5ebf3" font-weight="500" text-anchor="start">协作规则</text><text x="366" y="447" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">如何协作、哪些行动受约束</text><path d="M674 427H722" fill="none" stroke="#506074" stroke-width="2"/><path d="M302 513H344" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="346" y="476" width="328" height="74" rx="10" fill="#1d2733" stroke="#506074"/><text x="366" y="506" font-size="21" fill="#e5ebf3" font-weight="500" text-anchor="start">工作知识</text><text x="366" y="533" font-size="17" fill="#aab8c9" font-weight="400" text-anchor="start">项目事实、决定与经验</text><path d="M674 513H722" fill="none" stroke="#506074" stroke-width="2"/><path d="M722 169V567" fill="none" stroke="#506074" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="582" width="776" height="58" rx="10" fill="#213652" stroke="#8bb9ff"/><text x="56" y="620" font-size="22" fill="#8bb9ff" font-weight="500" text-anchor="start">按各自规则选择 → 本轮回答的上下文</text></g></svg>